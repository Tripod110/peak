name = "peak-scan"
main = "src/index.js"
compatibility_date = "2026-07-29"

[vars]
# Tunable without shipping an app update — that's the point of them living here.
FREE_SCANS_PER_DAY = "3"
GLOBAL_DAILY_CAP   = "5000"   # ~$6/day worst case on 2.5 Flash. Set it to what you'd tolerate losing.
MODEL              = "gemini-2.5-flash"
ALLOWED_ORIGIN     = "https://tripod110.github.io"

# Public half of the VAPID keypair for Web Push — not secret, it's shipped to
# every subscribing browser as the applicationServerKey. Generate both halves
# with: node worker/scripts/generate-vapid-keys.mjs
VAPID_PUBLIC_KEY = "BJ0-xGHMKxPhybg9kRn3AHo2dEYFxwkosBI-zdyob2qYQn5m2aSYsamYr3DoGG-UwEn9-FBAnTZPkyyTlFLMERo"
VAPID_SUBJECT    = "mailto:smasher8976@gmail.com"   # a contact a push service can reach if you're abusing it

# Cron trigger for reminder notifications — runs runReminders() in src/index.js.
[triggers]
crons = ["*/15 * * * *"]

# Create with: wrangler kv namespace create PEAK_KV
# then paste the id below.
[[kv_namespaces]]
binding = "PEAK_KV"
id = "7890f84653da49278570d11f6ce4e169"

# Secrets, never in this file:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put VAPID_PRIVATE_KEY   (the JWK line from generate-vapid-keys.mjs)
