<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The Gemini API key lives in localStorage, which means any script that runs
     here can read it. It can't be encrypted away (whatever decrypts it ships to
     the same device), so the useful control is the one that stops a stolen value
     from going anywhere: connect-src names the only host this app is ever
     allowed to talk to. script-src 'self' is why the service-worker registration
     moved into app.js — there are no inline scripts left, so an injected one
     cannot execute. 'unsafe-inline' remains only for style, which cannot run code.
     peak-scan.smasher8976.workers.dev is the deployed Worker (worker/) — reminders
     and, once wired, meal scanning talk to it. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  connect-src 'self' https://generativelanguage.googleapis.com https://peak-scan.smasher8976.workers.dev;
  form-action 'none';
  base-uri 'none';
  object-src 'none'">
<!-- no user-scalable=no: blocking pinch-zoom fails WCAG 1.4.4 and there is no
     good reason for it here — viewport-fit=cover is what the edge-to-edge
     layout actually needs. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peak — the training log that catches your plateaus</title>
<meta name="description" content="Peak flags a lift the moment it stops progressing, deloads it, and walks you back up to a new PR. Weekly volume vs MEV/MRV, AI meal scanning, sleep scores. Free, offline, no account.">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Peak">
<link rel="stylesheet" href="style.css?v=38">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <svg class="logo-peak" width="18" height="14" viewBox="0 0 18 14" aria-hidden="true">
      <polygon points="7,14 12.5,3 18,14" fill="#3987e5"/>
      <polygon points="0,14 6,1 12,14" fill="#d95926"/>
      <polygon points="6,1 4.2,4.6 6,3.4 7.8,4.6" fill="#ffffff"/>
    </svg>
    <h1 id="header-title">Peak</h1>
  </div>
  <div class="topbar-date" id="header-date"></div>
  <button class="icon-btn" data-action="open-settings" aria-label="Settings">⚙</button>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar" aria-label="Main">
  <button class="tab" data-tab="today"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg></span>Today</button>
  <button class="tab" data-tab="food"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5v17M4.5 3.5V8a2.5 2.5 0 0 0 5 0V3.5M17 20.5v-17c-2.2 1-3.5 3.6-3.5 7V13H17"/></svg></span>Food</button>
  <button class="tab" data-tab="train"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg></span>Train</button>
  <button class="tab" data-tab="sleep"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg></span>Sleep</button>
  <button class="tab" data-tab="grocery"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/><path d="M3 4h2.5l2.2 10.5h10.6L20.5 8H6.8"/></svg></span>Grocery</button>
</nav>

<!-- announcements for changes that happen without navigation (set done, next exercise) -->
<div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="rest-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<div id="fab-root">
  <div class="fab-menu" id="fab-menu" hidden>
    <button class="fab-item" data-action="quick-scan" data-close-fab>📷 Scan</button>
    <button class="fab-item" data-action="quick-food" data-close-fab>＋ Food</button>
    <button class="fab-item" data-action="quick-train" data-close-fab>🏋 Train</button>
    <button class="fab-item" data-action="quick-sleep" data-close-fab>☾ Sleep</button>
    <button class="fab-item" data-action="quick-weight" data-close-fab>⚖ Weight</button>
  </div>
  <button class="fab" id="fab-toggle" data-action="fab-toggle" aria-label="Quick add" aria-expanded="false">＋</button>
</div>

<script src="store.js?v=38"></script>
<script src="ui.js?v=38"></script>
<script src="charts.js?v=38"></script>
<script src="quips.js?v=38"></script>
<script src="api.js?v=38"></script>
<script src="food.js?v=38"></script>
<script src="train.js?v=38"></script>
<script src="routines.js?v=38"></script>
<script src="sleep.js?v=38"></script>
<script src="grocery.js?v=38"></script>
<script src="app.js?v=38"></script>
</body>
</html>
